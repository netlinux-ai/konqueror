name: Build .deb package

on:
  push:
    branches: [netlinux]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo sed -i 's/^Types: deb$/Types: deb deb-src/' /etc/apt/sources.list.d/ubuntu.sources
          sudo apt-get update
          sudo apt-get build-dep -y konqueror
          sudo apt-get install -y checkinstall

      - name: Build
        run: |
          cmake -B build -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j$(nproc)

      - name: Determine version
        id: version
        run: |
          major=$(sed -n 's/^set (RELEASE_SERVICE_VERSION_MAJOR "\([0-9]*\)")/\1/p' CMakeLists.txt)
          minor=$(sed -n 's/^set (RELEASE_SERVICE_VERSION_MINOR "\([0-9]*\)")/\1/p' CMakeLists.txt)
          micro=$(sed -n 's/^set (RELEASE_SERVICE_VERSION_MICRO "\([0-9]*\)")/\1/p' CMakeLists.txt)
          base="${major}.${minor}.${micro}"
          rev=${{ github.run_number }}
          echo "version=${base}-${rev}netlinux1" >> "$GITHUB_OUTPUT"
          echo "tag=v${base}-${rev}netlinux1" >> "$GITHUB_OUTPUT"

      - name: Package with checkinstall
        run: |
          sudo checkinstall --default \
            --pkgname=konqueror \
            --pkgversion="${{ steps.version.outputs.version }}" \
            --maintainer="graham@netlinux.co.uk" \
            --requires="libkf5parts5,libkf5kiocore5" \
            --pakdir=. \
            --install=no \
            --fstrans=no \
            cmake --install build

      - name: Repack .deb for reprepro compatibility
        run: |
          DEB=$(ls konqueror_*.deb)
          sudo chmod 666 "$DEB"
          mkdir repack && cd repack
          ar x "../$DEB"
          for f in *.zst; do
            [ -f "$f" ] || continue
            zstd -d "$f"
            xz "${f%.zst}"
            rm "$f"
          done
          rm "../$DEB"
          ar rcs "../$DEB" debian-binary control.tar.xz data.tar.xz

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: konqueror ${{ steps.version.outputs.version }}
          body: |
            Automated build from commit ${{ github.sha }}

            Install: `sudo dpkg -i konqueror_*.deb`
          files: konqueror_*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify package repository
        run: |
          sleep 5
          SIGNATURE=$(echo -n '{"repo":"netlinux-ai/konqueror","tag":"${{ steps.version.outputs.tag }}"}' \
            | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" -binary \
            | xxd -p -c 256)
          curl -sf -X POST \
            -H "Content-Type: application/json" \
            -H "X-Webhook-Signature: sha256=${SIGNATURE}" \
            -d '{"repo":"netlinux-ai/konqueror","tag":"${{ steps.version.outputs.tag }}"}' \
            https://packages.netlinux.co.uk/webhook/update-repo
